name: Import Together source into music

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out music repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import upstream source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/chtnnh/together.git /tmp/together-upstream
          rsync -a --delete --exclude='.git' --exclude='.github/workflows/import-together.yml' /tmp/together-upstream/ ./
          cat > README.md <<'EOF'
          # music

          Synchronized listening app based on [Together](https://github.com/chtnnh/together).

          ## Original project
          The upstream project is maintained by chtnnh. The original Apache-2.0 license and attribution are retained.

          ## music customization
          - Minimal black theme
          - One private room for two approved people
          - Synchronized YouTube playback
          - Room chat
          - Shared playlists
          - Listening history
          - Favourite songs

          **Access-control status:** The two-person server-side restriction is not implemented yet. A room code alone is not sufficient to guarantee that only two people can use the app.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Import Together source as music"
            git push origin HEAD:main
          fi
