name: Import Together source into music

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out music repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import upstream source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/chtnnh/together.git /tmp/together-upstream
          rsync -a --delete --exclude='.git' /tmp/together-upstream/ ./
          cat > README.md <<'EOF'
          # music

          Private two-person synchronized music listening app, based on [Together](https://github.com/chtnnh/together).

          ## Upstream
          The original project is maintained by chtnnh. Its Apache-2.0 license and attribution are retained in this repository.

          ## Planned customization
          - App branding: music
          - Minimal black theme
          - Private access restricted to two approved accounts
          - Shared listening room with synchronized playback
          - Room chat, shared playlists, listening history, and favourites

          **Security status:** Two-person access restrictions are not yet implemented. Do not treat this repository or a room code as access control until server-side authentication and authorization have been added and tested.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Import Together source as music"
            git push origin HEAD:main
          fi
