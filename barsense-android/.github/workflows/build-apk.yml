name: Build BarSense APK
on:
  workflow_dispatch:
  push:
    paths: [ "barsense-android/**" ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: barsense-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Assemble debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BarSense-debug-apk
          path: barsense-android/app/build/outputs/apk/debug/app-debug.apk
